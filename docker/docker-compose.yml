services:
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-queue_redis_pass!}
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - KEYS
      - ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-queue_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-queue_rabbit_pass!}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-queue_vhost}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  redis-data:
  rabbitmq-data:
